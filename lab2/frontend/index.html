<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная работа 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .card {
            background: rgba(0, 0, 0, 0.4);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 500px;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: #764ba2;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }
        button:hover {
            transform: scale(1.05);
            background: #f0f0f0;
        }
        #response {
            margin-top: 25px;
            font-size: 18px;
            min-height: 60px;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔬 Лабораторная работа</h1>
        <p>Docker Compose, KVM и Ansible</p>
        <button onclick="pingServer()">Пингануть сервер</button>
        <div id="response">Нажмите кнопку, чтобы отправить запрос...</div>
    </div>

    <script>
        async function pingServer() {
            const responseDiv = document.getElementById('response');
            responseDiv.textContent = 'Загрузка...';
            
            try {
                // Обращаемся к бэкенду по имени сервиса из docker-compose
                const res = await fetch('http://192.168.122.114:5000/ping');
                const data = await res.json();
                responseDiv.innerHTML = `
                    <strong>${data.message}</strong><br>
                    Сегодня: ${data.date}
                `;
            } catch (error) {
                responseDiv.textContent = 'Ошибка: ' + error.message;
            }
        }
    </script>
</body>
</html>
